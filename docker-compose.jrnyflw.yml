services:
  postgres:
    image: postgres:17-alpine
    container_name: jrnyflw-dev-postgres
    environment:
      POSTGRES_DB: jrnyflw
      POSTGRES_USER: jrnyflw
      POSTGRES_PASSWORD: jrnyflw_dev_password
    ports:
      - "5433:5432"
    volumes:
      - jrnyflw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jrnyflw -d jrnyflw"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jrnyflw-dev-redis
    ports:
      - "6380:6379"
    volumes:
      - jrnyflw_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jrnyflw_postgres_data:
  jrnyflw_redis_data:
