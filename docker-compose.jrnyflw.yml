# Own project name: this folder also holds docker-compose.yml, whose postgres/redis services would otherwise share the inferred
# project "jrnyflw" and be replaced by these (and vice versa). Volume names are pinned so the existing dev data is kept.
name: jrnyflw-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: jrnyflw-dev-postgres
    environment:
      POSTGRES_DB: jrnyflw
      POSTGRES_USER: jrnyflw
      POSTGRES_PASSWORD: jrnyflw_dev_password
    ports:
      - "5435:5432"
    volumes:
      - jrnyflw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jrnyflw -d jrnyflw"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jrnyflw-dev-redis
    ports:
      - "6381:6379"
    volumes:
      - jrnyflw_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jrnyflw_postgres_data:
    name: jrnyflw_jrnyflw_postgres_data
  jrnyflw_redis_data:
    name: jrnyflw_jrnyflw_redis_data
